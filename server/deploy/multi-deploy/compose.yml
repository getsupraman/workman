# Workman on a multi-deploy server (github.com/r-Larch/multi-deploy), behind its Traefik.
# Copy this folder to /opt/multi-deploy/apps/workman/, run ./gen-env.sh once, then `app deploy workman`.
# Keep the services in step with plugin/skills/setup/assets/compose.yml; this file adds
# the Traefik labels, the `web` network, the public origin and the trusted proxy, and publishes no port.
# More than one host: list every origin in WORKMAN_PUBLIC_URLS (each is its own OAuth issuer) and route them
# all with WORKMAN_HOSTS, a Traefik rule, e.g. Host(`workman.example.com`) || Host(`workman.example.org`).
# The image is pinned by WORKMAN_VERSION in .env: an upgrade is a deliberate edit, after a backup.

name: workman

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workman}
      POSTGRES_USER: ${POSTGRES_USER:-workman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - workman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workman} -d ${POSTGRES_DB:-workman}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/getsupraman/workman:${WORKMAN_VERSION:?set WORKMAN_VERSION in .env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Workman__Auth__ReaderToken: ${WORKMAN_READER_TOKEN:-}
      Workman__Dashboard__Username: ${WORKMAN_DASHBOARD_USERNAME:?set WORKMAN_DASHBOARD_USERNAME in .env}
      Workman__Dashboard__Password: ${WORKMAN_DASHBOARD_PASSWORD:?set WORKMAN_DASHBOARD_PASSWORD in .env}
      Workman__PublicUrl: ${WORKMAN_PUBLIC_URL:?set WORKMAN_PUBLIC_URL in .env}
      # Optional: further origins, comma-separated; a request is answered as the one its host names.
      Workman__PublicUrls: ${WORKMAN_PUBLIC_URLS:-}
      Workman__TrustedProxies: ${WORKMAN_TRUSTED_PROXIES:?set WORKMAN_TRUSTED_PROXIES in .env}
      ConnectionStrings__Workman: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-workman};Username=${POSTGRES_USER:-workman};Password=${POSTGRES_PASSWORD}
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.workman.rule=${WORKMAN_HOSTS:-Host(`${WORKMAN_HOST:?set WORKMAN_HOST in .env}`)}"
      - "traefik.http.routers.workman.entrypoints=websecure"
      - "traefik.http.routers.workman.tls.certresolver=letsencrypt"
      - "traefik.http.routers.workman.middlewares=workman-headers"
      - "traefik.http.services.workman.loadbalancer.server.port=8080"
      # /mcp and /api/stream are streamed: flush every chunk instead of buffering it.
      - "traefik.http.services.workman.loadbalancer.responseforwarding.flushinterval=1ms"
      - "traefik.http.services.workman.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.workman.loadbalancer.healthcheck.hostname=${WORKMAN_HOST}"
      - "traefik.http.services.workman.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.workman.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.middlewares.workman-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.workman-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.workman-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.workman-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.workman-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.workman-http.rule=${WORKMAN_HOSTS:-Host(`${WORKMAN_HOST}`)}"
      - "traefik.http.routers.workman-http.entrypoints=web"
      - "traefik.http.routers.workman-http.middlewares=workman-https"
      - "traefik.http.middlewares.workman-https.redirectscheme.scheme=https"
    restart: unless-stopped

networks:
  web:
    external: true
    name: web

volumes:
  workman-db-data:
