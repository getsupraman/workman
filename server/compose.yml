# The real thing: the API and its Postgres together (CONVENTIONS §"Two compose files, two jobs").
# Copy .env.example to .env and fill it before `docker compose -f server/compose.yml up -d`.
#
# The api service owns this database: it applies the schema at startup, so the volume below starts
# empty and stays the only copy of every project's plan, ledger and evidence (doc 08 §4).

name: workman

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workman}
      POSTGRES_USER: ${POSTGRES_USER:-workman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - workman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workman} -d ${POSTGRES_DB:-workman}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Workman__Dashboard__Username: ${WORKMAN_DASHBOARD_USERNAME:?set WORKMAN_DASHBOARD_USERNAME in .env}
      Workman__Dashboard__Password: ${WORKMAN_DASHBOARD_PASSWORD:?set WORKMAN_DASHBOARD_PASSWORD in .env}
      # Optional: the base of the web line work_brief and work_get print. Empty means the request's host.
      Workman__PublicUrl: ${WORKMAN_PUBLIC_URL:-}
      # Optional: further origins, comma-separated; a request is answered as the one its host names.
      Workman__PublicUrls: ${WORKMAN_PUBLIC_URLS:-}
      # Optional: IPs/CIDRs of the reverse proxy whose X-Forwarded-* is believed. Empty trusts nobody.
      Workman__TrustedProxies: ${WORKMAN_TRUSTED_PROXIES:-}
      ConnectionStrings__Workman: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-workman};Username=${POSTGRES_USER:-workman};Password=${POSTGRES_PASSWORD}
    ports:
      - "${WORKMAN_BIND:-127.0.0.1}:${WORKMAN_API_PORT:-5290}:8080"
    restart: unless-stopped

volumes:
  workman-db-data:
