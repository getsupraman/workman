# Workman without a clone: pulls the published image instead of building server/Dockerfile.
# Keep the services in step with server/compose.yml; only `image:` differs. The project name is the same
# (`workman`), so a machine that used the clone-based compose keeps its volume and its data.
# /workman:setup copies this file to ~/.workman/compose.yml and runs it with that directory's .env.
# A 1.x install (project `workstate`, ~/.workstate) moves here with /workman:setup --migrate.

name: workman

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workman}
      POSTGRES_USER: ${POSTGRES_USER:-workman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - workman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workman} -d ${POSTGRES_DB:-workman}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/getsupraman/workman:${WORKMAN_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Workman__Auth__WorkerToken: ${WORKMAN_WORKER_TOKEN:?set WORKMAN_WORKER_TOKEN in .env}
      Workman__Auth__OrchestratorToken: ${WORKMAN_ORCHESTRATOR_TOKEN:?set WORKMAN_ORCHESTRATOR_TOKEN in .env}
      Workman__Auth__ControllerToken: ${WORKMAN_CONTROLLER_TOKEN:?set WORKMAN_CONTROLLER_TOKEN in .env}
      # Optional, unlike the three above: empty means no reader token exists (doc 10 rule 5).
      Workman__Auth__ReaderToken: ${WORKMAN_READER_TOKEN:-}
      Workman__Dashboard__Username: ${WORKMAN_DASHBOARD_USERNAME:?set WORKMAN_DASHBOARD_USERNAME in .env}
      Workman__Dashboard__Password: ${WORKMAN_DASHBOARD_PASSWORD:?set WORKMAN_DASHBOARD_PASSWORD in .env}
      # Optional: the base of the web line work_brief and work_get print. Empty means the request's host.
      Workman__PublicUrl: ${WORKMAN_PUBLIC_URL:-}
      # Optional: further origins, comma-separated; a request is answered as the one its host names.
      Workman__PublicUrls: ${WORKMAN_PUBLIC_URLS:-}
      # Optional: IPs/CIDRs of the reverse proxy whose X-Forwarded-* is believed. Empty trusts nobody.
      Workman__TrustedProxies: ${WORKMAN_TRUSTED_PROXIES:-}
      ConnectionStrings__Workman: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-workman};Username=${POSTGRES_USER:-workman};Password=${POSTGRES_PASSWORD}
    ports:
      - "${WORKMAN_BIND:-127.0.0.1}:${WORKMAN_API_PORT:-5290}:8080"
    restart: unless-stopped

volumes:
  workman-db-data:
